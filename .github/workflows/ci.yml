name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04-arm-self-hosted
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: sbt
      - name: Set up sbt
        uses: sbt/setup-sbt@v1
      - name: Install yosys
        run: sudo apt-get update && sudo apt-get install -y yosys
      - name: Check formatting and lint, run tests
        run: sbt scalafmtCheckAll "scalafixAll --check" test
